version: '3.8'
services:
  backend:
    build: ./be
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/users
      - NODE_ENV=development
    depends_on:
      - mongo
    volumes:
      - ./be:/app

  frontend:
    build: ./fe
    ports:
      - "3000:80"

  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
